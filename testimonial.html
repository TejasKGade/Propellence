  <script>
    const testimonials = [
      {
        title: "Global Tier-1 R&D Center Launch: 100-Member Team in 12 Months",
        client: "Leading global engineering services provider",
        image: "images/incuba-next-innovation-hub-adept-plus-aart-architects_20.jpg",
        content: "Partnering with Propellence was pivotal for our R&D Center setup. Their domain expertise, talent network, and strategic approach helped us build a 100-member team with speed and quality unmatched in the industry. From C-level hiring to engineering talent, they were truly an extension of our leadership mission."
      },
      {
        title: "Multi-Location Strategic Scaling for Global Tier-1 Supplier",
        client: "Leading automotive Tier-1 supplier (ADAS, electrification, sensors)",
        image: "images/sensata-battery-sensing-solutions-button.jpeg",
        content: "Expanding in India and Europe simultaneously was complex, but the Propellence team handled recruitment, culture fit, and leadership placements with expertise. We now have high-performing teams in key R&D hubs, with measurable impact on our global product innovation."
      },
      {
        title: "European Leadership Expansion: Multi-Country Executive Placement",
        client: "Global engineering services provider with automotive focus",
        image: "images/A Guide to European Expansion_ Best Practices & Tips _ 2940x2100.jpg",
        content: "Propellence helped us identify, attract, and retain executive talent in multiple EU countries at record pace. Their market insight, approach and follow-through made the difference for our regional strategy."
      },
      {
        title: "Autonomous Vehicle Technology Team: Munich Innovation Hub",
        client: "Global engineering services provider",
        image: "images/berner-group-zukunftswerkstatt.jpg",
        content: "Our German innovation hub required specialized talent and seamless cross-border hiring; Propellence delivered with professionalism, local expertise, and an agile approach that suited our needs at every stage."
      }
    ];

    const menuToggle = document.querySelector('.menu-toggle');
    const navigation = document.querySelector('.site-nav');

    menuToggle.addEventListener('click', () => {
      const isOpen = menuToggle.getAttribute('aria-expanded') === 'true';
      menuToggle.setAttribute('aria-expanded', String(!isOpen));
      navigation.classList.toggle('is-open', !isOpen);
    });

    function getSelectedTestimonial() {
      const id = Number.parseInt(new URLSearchParams(window.location.search).get('id'), 10);
      return testimonials[id > 0 ? id - 1 : 0];
    }

    function setMeta(testimonial) {
      const title = testimonial.title + ' | Propellence Consulting Success Story';
      const description = testimonial.content.slice(0, 155);
      document.title = title;
      document.querySelector('meta[name="description"]').setAttribute('content', description);
      document.querySelector('meta[property="og:title"]').setAttribute('content', title);
      document.querySelector('meta[property="og:description"]').setAttribute('content', description);
      document.querySelector('meta[name="twitter:title"]').setAttribute('content', title);
      document.querySelector('meta[name="twitter:description"]').setAttribute('content', description);
    }

    function renderTestimonial() {
      const container = document.getElementById('testimonial');
      const testimonial = getSelectedTestimonial();
      container.replaceChildren();

      if (!testimonial) {
        const title = document.createElement('h1');
        title.textContent = 'Success Story Not Found';
        const message = document.createElement('p');
        message.textContent = "The success story you're looking for doesn't exist.";
        const link = document.createElement('a');
        link.href = 'index.html#success-stories';
        link.className = 'back-link';
        link.textContent = 'Back to Success Stories';
        container.append(title, message, link);
        document.title = 'Success Story Not Found | Propellence Consulting';
        return;
      }

      setMeta(testimonial);

      const image = document.createElement('img');
      image.className = 'testimonial-image';
      image.src = testimonial.image;
      image.alt = testimonial.title;

      const title = document.createElement('h1');
      title.className = 'testimonial-title';
      title.textContent = testimonial.title;

      const client = document.createElement('p');
      client.className = 'testimonial-client';
      client.innerHTML = '<strong>Client:</strong> ';
      client.append(document.createTextNode(testimonial.client));

      const quote = document.createElement('blockquote');
      quote.className = 'testimonial-content';
      quote.textContent = testimonial.content;

      const link = document.createElement('a');
      link.href = 'index.html#success-stories';
      link.className = 'back-link';
      link.textContent = 'Back to Success Stories';

      container.append(image, title, client, quote, link);
    }

    renderTestimonial();
  </script>
